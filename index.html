:root{--bg:#0d1320;--panel:#111a2b;--panel2:#18233a;--line:#31405e;--text:#e9eef8;--muted:#9eabc1;--accent:#39bdf8;--violet:#7c5cff;--warn:#ffb020;--radius:22px;--shadow:0 18px 60px rgba(0,0,0,.35);--days:4;--calpanes:2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0d1320,#10182a 55%,#09101d);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{min-height:100vh;padding:28px;display:flex;gap:20px;flex-direction:column}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}h1{font-size:42px;line-height:1;margin:0 0 8px}.sub{font-size:17px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{background:var(--panel2);border:1px solid var(--line);padding:12px 15px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.12)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--violet));border:0;color:#fff;font-weight:800}.btn.small{padding:8px 10px;border-radius:10px;font-size:13px}.btn.danger{background:#2b1520;color:#ff9aa0;border-color:#65313a}.layout{display:grid;grid-template-columns:minmax(280px,350px) 1fr;gap:20px;align-items:start}.sidebar,.board,.longterm{background:rgba(17,26,43,.88);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.sidebar{padding:18px;position:sticky;top:18px}.section-title{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#9aa8bd;font-weight:900;margin:16px 0 10px}.field{display:flex;gap:8px;align-items:center;margin:8px 0}.field label{font-size:14px;color:var(--muted);min-width:118px}.field input,.field select{width:100%;background:#070d1a;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px}.hint{font-size:12px;color:#7f8ca3;line-height:1.35}.calendar-pane{border:1px solid var(--line);background:#0b1221;border-radius:16px;padding:12px;margin:10px 0}.pane-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.pane-name{font-weight:900}.ics-item{background:#060b16;border:1px solid #23324d;border-radius:12px;padding:9px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0}.ics-item b{font-size:13px}.ics-item span{font-size:11px;color:var(--muted);word-break:break-all}.status{font-size:11px;color:#aeb7c7;margin-top:8px}.board{padding:18px;min-width:0}.timeline-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.timeline{display:grid;gap:14px;grid-template-columns:repeat(var(--days),minmax(280px,1fr));overflow-x:auto;padding-bottom:8px}.day{min-height:690px;background:#0b1221;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}.day.today{border-color:var(--accent);box-shadow:0 0 0 1px rgba(57,189,248,.55),0 0 44px rgba(57,189,248,.10)}.day-head{background:var(--panel2);padding:18px 18px 14px}.day-num{font-size:34px;font-weight:1000;letter-spacing:.04em}.day-meta{color:var(--muted);font-size:14px}.badge{display:inline-flex;margin-top:9px;border-radius:999px;background:#263866;color:#c9d8ff;padding:5px 10px;font-size:12px;font-weight:800}.day-body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}.partition{border-top:1px solid rgba(49,64,94,.75);padding-top:13px}.part-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.part-title{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#a7b3c6;font-weight:1000}.split{display:grid;grid-template-columns:repeat(var(--calpanes),1fr);gap:10px}.lane{min-width:0;background:#070d1a;border:1px dashed #293955;border-radius:15px;padding:10px}.lane-title{font-size:12px;color:#9eabc1;font-weight:900;margin-bottom:8px}.card{background:#050a16;border:1px solid #263655;border-radius:14px;padding:11px;margin:8px 0}.card.event{border-left:3px solid var(--accent)}.card.task{border-left:3px solid var(--violet)}.card.overdue{border-left:3px solid var(--warn);background:#1a1003}.card.done{opacity:.56;text-decoration:line-through}.card b{display:block;font-size:15px}.card small{display:block;color:var(--muted);margin-top:5px}.empty{color:#718097;font-size:14px;padding:7px 0}.task-row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start}.task-row input{margin-top:4px}.kebab{background:transparent;color:#718097;font-size:18px}.longterm{padding:18px}.long-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.long-card{background:#070d1a;border:1px solid #293955;border-radius:16px;padding:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{width:min(920px,100%);max-height:90vh;overflow:auto;background:#111a2b;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px}.modal h2{margin:0 0 14px}.modal-grid{display:grid;gap:10px}.modal-grid input,.modal-grid textarea,.modal-grid select{width:100%;background:#070d1a;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.toast{position:fixed;right:22px;bottom:22px;background:#06101c;border:1px solid var(--line);padding:12px 14px;border-radius:14px;color:#dce6f6;box-shadow:var(--shadow);display:none;z-index:20;max-width:520px}.pill{display:inline-flex;border:1px solid #273853;background:#06101c;border-radius:999px;padding:6px 9px;color:#aeb7c7;font-size:12px;margin:3px 3px 0 0}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.month-head{font-size:12px;color:#9eabc1;text-align:center;font-weight:900;text-transform:uppercase}.month-cell{min-height:96px;background:#070d1a;border:1px solid #293955;border-radius:14px;padding:8px}.month-cell.out{opacity:.35}.month-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px rgba(57,189,248,.35)}.month-day{font-size:13px;color:#aeb7c7;font-weight:900;margin-bottom:6px}.month-event{background:rgba(124,92,255,.9);color:#fff;border-radius:9px;padding:4px 6px;font-size:11px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.month-task{background:rgba(255,176,32,.18);border:1px solid rgba(255,176,32,.45);color:#ffd99a;border-radius:9px;padding:4px 6px;font-size:11px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}.month-title{font-size:20px;font-weight:1000}.diag{background:#07101d;border:1px solid #243653;border-radius:14px;padding:10px;margin-top:8px;color:#9fb0c8;font-size:12px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:0}.timeline{grid-template-columns:repeat(var(--days),minmax(310px,86vw))}h1{font-size:32px}.top{flex-direction:column}.toolbar{justify-content:flex-start}.app{padding:16px}.month-grid{grid-template-columns:repeat(7,minmax(70px,1fr));overflow-x:auto}}

/* Rev 007: Begrenzungen und saubere Anzeige */
.ics-item{grid-template-columns:minmax(0,1fr) auto!important;overflow:hidden}
.ics-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lane,.card{overflow:hidden;max-width:100%}
.card b,.card small{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-cell{height:112px!important;overflow:hidden!important;display:flex;flex-direction:column}
.month-event,.month-task{max-height:34px;overflow:hidden;text-overflow:ellipsis}

/* Rev 008: Einstellungen/Legende ausgelagert + Event-Zeitspalte */
.settings-grid{display:grid;gap:10px}
.legend-grid{display:grid;grid-template-columns:1fr;gap:8px}
.legend-row{display:flex;align-items:center;gap:10px;background:#070d1a;border:1px solid #293955;border-radius:12px;padding:10px}
.legend-swatch{width:18px;height:18px;border-radius:6px;flex:0 0 18px;border:1px solid rgba(255,255,255,.25)}
.swatch-event{background:rgba(124,92,255,.9)}
.swatch-task{background:rgba(255,176,32,.28)}
.swatch-overdue{background:rgba(255,70,70,.24)}
.swatch-long{background:#070d1a}
.event-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:center;min-width:0}
.event-timebox{font-size:10px;line-height:1.15;color:#9eabc1;text-align:left;padding-top:0;white-space:normal;align-self:center}
.event-timebox span{display:block}
.event-title{min-width:0}
.month-overdue{background:rgba(255,80,80,.18);border:1px solid rgba(255,90,90,.45);color:#ffc8c8;border-radius:9px;padding:4px 6px;font-size:11px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-done{background:rgba(72,211,139,.16);border:1px solid rgba(72,211,139,.38);color:#b9f5d4;border-radius:9px;padding:4px 6px;font-size:11px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:line-through}
.ics-click{cursor:pointer;min-width:0}
.ics-click:hover b{text-decoration:underline}
.month-statusbar{height:12px;border-radius:999px;margin:5px 0;font-size:0;line-height:0}
.month-statusbar.task{background:rgba(255,176,32,.55);border:1px solid rgba(255,176,32,.75)}
.month-statusbar.overdue{background:rgba(255,80,80,.48);border:1px solid rgba(255,90,90,.75)}



/* Rev 010: Themes, editierbare Farben und saubereres Wording */
:root{--eventColor:#7c5cff;--taskColor:#ffb020;--overdueColor:#ff5050;--longColor:#48d38b}
.card.event{border-left-color:var(--eventColor)!important}
.card.task{border-left-color:var(--taskColor)!important}
.card.overdue{border-left-color:var(--overdueColor)!important}
.month-event{background:var(--eventColor)!important}
.month-statusbar.task{background:var(--taskColor)!important;border-color:var(--taskColor)!important}
.month-statusbar.overdue{background:var(--overdueColor)!important;border-color:var(--overdueColor)!important}
.long-card{border-left:3px solid var(--longColor)}
.pane-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.color-palette{display:grid;grid-template-columns:repeat(6,32px);gap:8px;margin-top:8px}
.color-choice{width:32px;height:32px;border-radius:10px;border:2px solid rgba(255,255,255,.25);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.color-choice.active{outline:3px solid var(--text);outline-offset:2px}
.color-config{display:grid;grid-template-columns:1fr;gap:14px}.color-config label{font-weight:900}.color-preview{width:18px;height:18px;border-radius:6px;display:inline-block;vertical-align:middle;margin-right:8px;border:1px solid rgba(255,255,255,.28)}
body.light{background:linear-gradient(145deg,#f3f6fb,#e8eef8 58%,#f7f9fc);color:#152033}
body.light .sidebar,body.light .board,body.light .longterm,body.light .modal{background:rgba(255,255,255,.92);border-color:#cbd6e7;color:#152033}
body.light .calendar-pane,body.light .day,body.light .lane,body.light .field input,body.light .field select,body.light .modal-grid input,body.light .modal-grid textarea,body.light .modal-grid select,body.light .long-card,body.light .month-cell,body.light .diag,body.light .legend-row,body.light .ics-item{background:#f8fbff;border-color:#cbd6e7;color:#152033}
body.light .day-head,body.light .btn{background:#e9eff8;border-color:#cbd6e7;color:#152033}
body.light .btn.primary{background:linear-gradient(135deg,#2aa9e9,#725cff);color:#fff}
body.light .card{background:#ffffff;border-color:#d5deec;color:#152033}
body.light .empty,body.light .hint,body.light .sub,body.light .field label,body.light .section-title,body.light .part-title,body.light .lane-title,body.light .day-meta,body.light .card small{color:#5d6d83}
body.light .toast{background:#fff;border-color:#cbd6e7;color:#152033}
body.light .pill{background:#f8fbff;border-color:#cbd6e7;color:#42536b}


/* Rev 011 neu: konservative Erweiterungen auf Basis Rev 010 */
.day.today{background:rgba(255,255,255,.055)!important}
body.light .day.today{background:#dfe7f2!important}
.legend-row{justify-content:space-between}
.legend-main{display:flex;align-items:center;gap:10px;min-width:0}
.legend-edit{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 34px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.legend-palette-wrap{display:none;margin:8px 0 12px 44px}
.legend-palette-wrap.open{display:block}
.card.event{cursor:pointer}
.card.event:hover b{text-decoration:underline}
.own-event-btn{margin-left:auto}
.event-detail-grid{display:grid;grid-template-columns:150px 1fr;gap:8px 12px}
.event-detail-grid b{color:var(--muted)}
body.light .event-detail-grid b{color:#5d6d83}


/* Rev 012: dynamische Kalenderverwaltung + Langfristige-Task-Erledigungen */
.calendar-pane.hidden-cal{opacity:.55}
.calendar-pane.hidden-cal .status::after{content:" · ausgeblendet";color:var(--warn)}
.pane-name-row{display:flex;align-items:center;gap:8px;min-width:0}
.visibility-pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--muted);white-space:nowrap}
.add-calendar-box{margin-top:10px;border:1px dashed var(--line);border-radius:16px;padding:12px;background:#070d1a;display:flex;align-items:center;justify-content:space-between;gap:8px}
body.light .add-calendar-box{background:#f8fbff;border-color:#cbd6e7}
.completed-long{border-left:3px solid var(--longColor)!important;background:rgba(72,211,139,.10)!important}
body.light .completed-long{background:#eefaf4!important}


/* Rev 013: kompakte Kalender-Kachelbedienung */
.calendar-pane .pane-head{
  display:flex!important;
  flex-direction:column!important;
  align-items:stretch!important;
  gap:10px!important;
}
.cal-title-line{
  display:flex;
  align-items:center;
  gap:0;
  min-width:0;
}
.cal-title-click{
  display:inline-flex;
  align-items:center;
  gap:3px;
  min-width:0;
  max-width:100%;
  cursor:pointer;
  border-radius:10px;
  padding:4px 6px;
}
.cal-title-click:hover{
  background:rgba(255,255,255,.06);
}
body.light .cal-title-click:hover{
  background:rgba(15,23,42,.06);
}
.cal-title-click .pane-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
}
.cal-edit-icon{
  font-size:14px;
  opacity:.88;
  flex:0 0 auto;
  margin-left:1px;
}
.pane-actions{
  display:flex!important;
  flex-wrap:wrap!important;
  gap:8px!important;
  align-items:center!important;
  justify-content:flex-start!important;
}
.icon-btn{
  width:36px;
  height:36px;
  padding:0!important;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:17px!important;
  line-height:1;
}
.visibility-btn{
  font-size:18px!important;
}
.visibility-btn.hidden-state{
  opacity:.65;
}
.trash-btn{
  background:#2b1520!important;
  color:#ff9aa0!important;
  border-color:#65313a!important;
}
.ics-item{
  grid-template-columns:minmax(0,1fr) 40px!important;
}
.ics-item .trash-btn{
  width:32px;
  height:32px;
  font-size:15px!important;
}


/* Rev 014: ICS-spezifische Farben + null Kalender möglich + Dark-Mode Lesbarkeit */
.cal-title-click{
  color:var(--text)!important;
  background:transparent;
  border:0;
}
.cal-title-click .pane-name{
  color:var(--text)!important;
  font-weight:900!important;
}
body.light .cal-title-click,
body.light .cal-title-click .pane-name{
  color:#152033!important;
}
.ics-actions{
  display:flex;
  gap:6px;
  align-items:center;
  justify-content:flex-end;
}
.ics-item{
  grid-template-columns:minmax(0,1fr) auto!important;
}
.ics-color-dot{
  width:14px;
  height:14px;
  border-radius:999px;
  display:inline-block;
  border:1px solid rgba(255,255,255,.35);
  margin-right:6px;
  vertical-align:-2px;
}
.ics-settings-btn{
  width:32px;
  height:32px;
  padding:0!important;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.card.event[data-ics-color]{
  border-left-width:4px!important;
}
.no-calendar-note{
  border:1px dashed var(--line);
  border-radius:16px;
  padding:12px;
  background:#070d1a;
  color:var(--muted);
}
body.light .no-calendar-note{
  background:#f8fbff;
  border-color:#cbd6e7;
}


/* Rev 016: einzelne ICS-Sichtbarkeit + neue Icons + Navigation ±1 Tag */
.eye-icon{
  position:relative;
  width:22px;
  height:18px;
  display:inline-block;
}
.eye-icon::before{
  content:"";
  position:absolute;
  left:2px;
  top:4px;
  width:18px;
  height:12px;
  border:2px solid currentColor;
  border-radius:18px 18px 12px 12px;
}
.eye-icon::after{
  content:"";
  position:absolute;
  left:8px;
  top:8px;
  width:6px;
  height:6px;
  background:currentColor;
  border-radius:999px;
}
.eye-icon.off{
  opacity:.65;
}
.eye-icon.off .slash,
.eye-icon.off::marker{
  display:none;
}
.eye-icon.off::after{
  background:currentColor;
}
.eye-icon.off span{
  position:absolute;
  left:1px;
  top:8px;
  width:22px;
  height:2px;
  background:currentColor;
  transform:rotate(-32deg);
  border-radius:999px;
}
.ics-item.hidden-ics{
  opacity:.52;
}
.ics-item.hidden-ics .ics-click span::after{
  content:" · ausgeblendet";
  color:var(--warn);
}
.ics-trash-btn{
  background:var(--panel2)!important;
  color:#ff9aa0!important;
  border-color:var(--line)!important;
}
body.light .ics-trash-btn{
  background:#e9eff8!important;
  color:#b4232e!important;
  border-color:#cbd6e7!important;
}


/* Rev 017: Kalender hinzufügen als Auswahl, eigene Kalender, bessere Icons */
.pane-actions .btn[data-add-source]{
  min-width:36px;
  height:36px;
  padding:0!important;
  font-size:22px!important;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.option-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option-card{
  background:#070d1a;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;
}
.option-card b{display:block;margin-bottom:6px}
body.light .option-card{background:#f8fbff;border-color:#cbd6e7;color:#152033}
.toolbar-clean{font-weight:800}
.sidebar .btn#settingsBtn,.sidebar .btn#legendBtn{
  font-weight:800;
}
.ics-actions .btn{
  width:38px!important;
  height:38px!important;
  font-size:20px!important;
  border-color:#51617d!important;
  color:#e9eef8!important;
}
body.light .ics-actions .btn{
  border-color:#aebbd0!important;
  color:#152033!important;
}
.ics-actions .ics-trash-btn{
  color:#ffb4b4!important;
  background:#18233a!important;
}
body.light .ics-actions .ics-trash-btn{
  color:#9f1239!important;
  background:#f8fbff!important;
}
.ics-click span{font-size:11px;color:var(--muted)}
.own-calendar-note{
  font-size:11px;color:var(--muted);margin-top:6px;
}
.event-delete-btn{
  margin-top:10px;
}


/* Rev 018: Icon-System vereinheitlicht, ausgeblendet-Text entfernt, Link in Einstellungen */
.ics-item.hidden-ics .ics-click span::after,
.calendar-pane.hidden-cal .status::after{
  content:none!important;
}
.ui-icon-btn{
  width:40px!important;
  height:40px!important;
  min-width:40px!important;
  padding:0!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  border-radius:12px!important;
  background:var(--panel2)!important;
  border:1px solid var(--line)!important;
  color:var(--text)!important;
  font-size:19px!important;
  line-height:1!important;
  box-shadow:0 4px 12px rgba(0,0,0,.14)!important;
}
.ui-icon-btn svg{
  width:21px;
  height:21px;
  display:block;
  stroke:currentColor;
}
.ui-icon-btn:hover{
  filter:brightness(1.12);
}
.ui-icon-btn.trash-unified{
  color:#ff8f9a!important;
}
body.light .ui-icon-btn{
  background:#e9eff8!important;
  border-color:#cbd6e7!important;
  color:#152033!important;
}
body.light .ui-icon-btn.trash-unified{
  color:#b4232e!important;
}
.ics-actions{
  display:flex!important;
  align-items:center!important;
  gap:7px!important;
}
.pane-actions{
  align-items:center!important;
}
.ics-click{
  cursor:default!important;
}
.ics-click:hover b{

function collectSearchItems(){
  const items=[];
  (state.tasks||[]).forEach(t=>items.push({type:'Task',title:t.title||'',date:t.date||fmtDate(new Date()),meta:t.note||'Tagestask'}));
  (state.longterm||[]).forEach(t=>items.push({type:'Langfristig',title:t.title||'',date:t.createdDate||fmtDate(new Date()),meta:t.note||'Langfristiger Task'}));
  (state.calendars||[]).forEach(cal=>{
    [...(cal.events||[]),...(cal.ownEvents||[])].forEach(e=>items.push({type:'Termin',title:e.summary||'',date:fmtDate(new Date(e.start)),meta:(cal.name||'')+' · '+eventTime(e)}));

const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

function normalizeRelationalIds(){
  const calMap=new Map(), sourceMap=new Map(), taskGroupMap=new Map(), longGroupMap=new Map();
  (state.calendars||[]).forEach(cal=>{
    const old=cal.id||cal.dbId;
    if(!isUuid(old)){cal.id=newUuid();}else cal.id=old;
    cal.dbId=cal.id;
    if(old&&old!==cal.id)calMap.set(old,cal.id);
    (cal.links||[]).forEach(src=>{
      const so=src.id;
      if(!isUuid(so)){src.id=newUuid();sourceMap.set(so,src.id);} 
      src.calendarGroupId=cal.id;
    });
  });
  (state.taskColumns||[]).forEach(g=>{const old=g.id;if(!isUuid(old)){g.id=newUuid();taskGroupMap.set(old,g.id);}});
  (state.tasks||[]).forEach(t=>{if(!isUuid(t.id))t.id=newUuid(); if(taskGroupMap.has(t.columnId))t.columnId=taskGroupMap.get(t.columnId);});
  (state.longColumns||[]).forEach(g=>{const old=g.id;if(!isUuid(old)){g.id=newUuid();longGroupMap.set(old,g.id);}});
  (state.longterm||[]).forEach(t=>{if(!isUuid(t.id))t.id=newUuid(); if(longGroupMap.has(t.columnId))t.columnId=longGroupMap.get(t.columnId);});
  (state.calendars||[]).forEach(cal=>(cal.ownEvents||[]).forEach(e=>{if(!isUuid(e.id))e.id=newUuid(); if(sourceMap.has(e.sourceId))e.sourceId=sourceMap.get(e.sourceId);}));

// Robusteres Dedupe: zusätzlich bei Tagesdarstellung nach tatsächlicher Occurrence deduplizieren
function dedupeOccurrences(events){
  const map=new Map(); const norm=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
  (events||[]).forEach(e=>{
    const start=new Date(e.start); const end=e.end?new Date(e.end):null;
    const key=[e.icsId||e.sourceId||'',norm(e.summary),isNaN(start)?String(e.start):start.toISOString(),end&&!isNaN(end)?end.toISOString():''].join('|');
    const old=map.get(key);
    if(!old)map.set(key,e);
    else if(old.rrule && !e.rrule)map.set(key,e);
  });
  return Array.from(map.values());
}
const __rev40_calendarLanes=calendarLanes;
calendarLanes=function(date){

    const visibleOwnIds=(cal.links||[]).filter(l=>l.type==='own'&&l.visible!==false).map(l=>l.id);
    const icsEvents=(cal.events||[]).map((e,ei)=>{const occ=eventOccurrenceForDate(e,date);return occ?Object.assign(occ,{_type:'ics',_cal:ci,_idx:ei}):null;}).filter(e=>{if(!e)return false;const l=(cal.links||[]).find(x=>x.id===e.icsId);return (!l||l.visible!==false);});
    const ownEvents=(cal.ownEvents||[]).map((e,ei)=>{const occ=eventOccurrenceForDate(e,date);return occ?Object.assign(occ,{_type:'own',_cal:ci,_idx:ei}):null;}).filter(e=>e&&visibleOwnIds.includes(e.sourceId));
    const events=dedupeOccurrences([...icsEvents,...ownEvents]).sort((a,b)=>new Date(a.start)-new Date(b.start));
    const ownSources=(cal.links||[]).filter(l=>l.type==='own'&&l.visible!==false);
    return `<div class="lane"><div class="lane-title" style="display:flex;align-items:center;gap:8px"><span>${escapeHtml(cal.name)}</span>${ownSources.length?`<button class="btn small own-event-btn plus-only" data-add-own-event="${ci}:${iso}" title="Eigenen Termin hinzufügen">+</button>`:''}</div>${events.length?events.map(e=>{const tp=eventTimeParts(e);const ref=`${e._type}:${e._cal}:${e._idx}:${iso}`;const recur=(e.recurrence&&e.recurrence!=='none')?` · ${recurrenceLabel(e.recurrence)}`:(e.rrule?` · Wiederholung`:'');const cancelled=(String(e.status||'').toUpperCase()==='CANCELLED');const label=cancelled?' · Abgesagt':'';const h=eventVisualHeight(e);return `<div class="card event ${cancelled?'cancelled':''}" data-event-ref="${ref}" data-ics-color="1" style="border-left-color:${escapeHtml(e.icsColor||state.colors.event)}!important;min-height:${h}px;padding-top:${h<42?'7':'11'}px;padding-bottom:${h<42?'7':'11'}px" title="${escapeHtml(e.summary)}"><div class="event-row"><div class="event-timebox"><span>${escapeHtml(tp.start)}</span><span>${escapeHtml(tp.end)}</span></div><div class="event-title"><b>${escapeHtml(shortText(e.summary+(cancelled?' (abgesagt)':''),30))}</b><small>${escapeHtml(shortText((e.icsName||e.source||cal.name)+recur+label,34))}</small></div></div></div>`}).join(''):'<div class="empty">Keine Einträge.</div>'}</div>`;

  const taskHtml=(state.taskColumns||[]).map(c=>modeCheckbox(c.name,Object.prototype.hasOwnProperty.call(mode.taskVisible||{},c.id)?!!mode.taskVisible[c.id]:c.visible!==false,`data-mode-task="${escapeHtml(c.id)}"`)).join('')||'<div class="hint">Keine Tagestask-Spalten.</div>';
  const longHtml=(state.longColumns||[]).map(c=>modeCheckbox(c.name,Object.prototype.hasOwnProperty.call(mode.longVisible||{},c.id)?!!mode.longVisible[c.id]:c.visible!==false,`data-mode-long="${escapeHtml(c.id)}"`)).join('')||'<div class="hint">Keine Langfrist-Gruppen.</div>';
  $('#modalTitle').textContent='Modus konfigurieren';
  $('#modalContent').innerHTML=`<div class="edit-grid"><div class="mode-config-toolbar"><select id="modePickerTop">${modeOptions}</select></div><label>Name des Modus</label><input id="modeNameInput" value="${escapeHtml(mode.name)}"><div class="mode-config-list"><div class="mode-config-section"><div class="mode-config-section-title">Kalender und ICS-Links</div><div class="mode-config-grid">${calHtml}</div></div><div class="mode-config-section"><div class="mode-config-section-title">Tagestask-Spalten</div><div class="mode-config-grid">${taskHtml}</div></div><div class="mode-config-section"><div class="mode-config-section-title">Langfristige Task-Gruppen</div><div class="mode-config-grid">${longHtml}</div></div></div></div>`;
  $('#modalBackdrop').style.display='flex'; $('#saveModal').style.display='';
  const actions=document.querySelector('.modal-actions');
  let oldDelete=document.querySelector('#deleteModeBtnAction'); if(oldDelete)oldDelete.remove();
  const deleteBtn=document.createElement('button'); deleteBtn.className='btn danger mode-delete-action'; deleteBtn.id='deleteModeBtnAction'; deleteBtn.type='button'; deleteBtn.textContent='Löschen';
  actions.insertBefore(deleteBtn,$('#saveModal'));
  $('#modePickerTop').onchange=e=>openViewModeConfigModal(e.target.value);
  deleteBtn.onclick=()=>{if(!confirm('Diesen Ansichtsmodus löschen?'))return; state.viewModes=state.viewModes.filter(m=>m.id!==mode.id); state.activeViewMode=state.viewModes[0]?.id||''; deleteBtn.remove(); closeModal(); render(); toast('Modus gelöscht.');};
  $$('[data-mode-cal]').forEach(x=>x.onchange=syncModeChildrenInModal); syncModeChildrenInModal();
  $('#saveModal').onclick=()=>{
    mode.name=$('#modeNameInput').value.trim()||mode.name||'Modus'; mode.calendarVisible={}; mode.icsVisible={}; mode.taskVisible={}; mode.longVisible={};
    $$('[data-mode-cal]').forEach(x=>mode.calendarVisible[x.dataset.modeCal]=x.checked);
    $$('[data-mode-ics]').forEach(x=>mode.icsVisible[x.dataset.modeIcs]=x.checked);
    $$('[data-mode-task]').forEach(x=>mode.taskVisible[x.dataset.modeTask]=x.checked);
    $$('[data-mode-long]').forEach(x=>mode.longVisible[x.dataset.modeLong]=x.checked);
    state.activeViewMode=mode.id; applyViewMode(mode.id); closeModal(); render(); toast('Modus gespeichert.');
  };
};



/* Rev 041: Schutz gegen unbeabsichtigtes Löschen tabellarischer Fachdatensätze
   Problemursache: Der bisherige relationale Snapshot hat nicht nur geupsertet,
   sondern auch alle Tabellenzeilen gelöscht, die im aktuellen Frontend-State fehlten.
   Wenn ein Reload/Versionswechsel/Load-Fehler kurzzeitig einen leeren state.tasks erzeugt,
   konnten dadurch vorhandene Tagestasks aus Supabase verschwinden.
   Korrektur: Snapshot-Speicherung löscht nichts mehr automatisch. Löschungen erfolgen nur noch
   explizit über Nutzeraktionen und dann gezielt per DELETE auf der passenden Tabelle. */
async function dbDeleteRowRev041(table,id){
  if(!currentUser||!id)return;
  const {error}=await supabaseClient.from(table).delete().eq('user_id',currentUser.id).eq('id',id);
  if(error){console.error('DELETE fehlgeschlagen',table,id,error);toast('Löschen in Tabelle fehlgeschlagen: '+error.message);}
}
async function dbUpdateRowRev041(table,id,values){
  if(!currentUser||!id)return;
  const {error}=await supabaseClient.from(table).update(values).eq('user_id',currentUser.id).eq('id',id);
  if(error){console.error('UPDATE fehlgeschlagen',table,id,error);toast('Speichern in Tabelle fehlgeschlagen: '+error.message);}
}
// WICHTIG: kein automatisches Tabellen-Bereinigungs-DELETE mehr beim Snapshot.
deleteMissing=async function(table,ids){ return; };
// Schnellere, aber weiterhin entprellte Speicherung.
scheduleRelationalSave=function(){
  if(!currentUser||suppressCloudSave)return;
  clearTimeout(relationalSaveTimer);
  relationalSaveTimer=setTimeout(saveRelationalSnapshot,150);
};

// Tagestask-Tageskarte mit expliziter Tabellenlöschung und sofortigem Update beim Abhaken.
dayCard=function(date){
  const today=new Date();today.setHours(0,0,0,0);const iso=fmtDate(date);
  const visibleTaskIds=(state.taskColumns||[]).filter(c=>c.visible!==false).map(c=>c.id);
  const visibleLongIds=(state.longColumns||[]).filter(c=>c.visible!==false).map(c=>c.id);
  const openTasks=state.tasks.filter(t=>t.date===iso&&!t.done&&visibleTaskIds.includes(t.columnId||state.taskColumns?.[0]?.id));
  const overdue=sameDay(date,today)?state.tasks.filter(t=>t.date<fmtDate(today)&&!t.done&&visibleTaskIds.includes(t.columnId||state.taskColumns?.[0]?.id)):[];
  const completedLong=state.longterm.filter(t=>t.done&&t.completedDate===iso&&visibleLongIds.includes(t.columnId||state.longColumns?.[0]?.id));
  const completedTasks=state.tasks.filter(t=>t.done&&t.completedDate===iso&&visibleTaskIds.includes(t.columnId||state.taskColumns?.[0]?.id));
  const showCompleted=completedTasks.length||completedLong.length;
  const day=document.createElement('div');day.className='day'+(sameDay(date,today)?' today':'');
  day.innerHTML=`<div class="day-head"><div class="day-num"><span class="day-title-weekday">${escapeHtml(date.toLocaleDateString('de-DE',{weekday:'long'}))}</span><span class="day-title-date">${escapeHtml(date.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}))}</span></div>${sameDay(date,today)?'<span class="badge">Aktueller Tag</span>':''}</div><div class="day-body"><div class="partition"><div class="part-head"><div class="part-title">1. Terminkalender</div></div><div class="split">${calendarLanes(date)}</div></div><div class="partition"><div class="part-head"><div class="part-title">2. Tagestasks</div><button class="btn small" data-task-date="${iso}">+ Hinzufügen</button></div>${taskColumnsList(openTasks)}</div>${sameDay(date,today)?`<div class="partition"><div class="part-head"><div class="part-title">3. Überzogene Tagestasks</div></div>${taskList(overdue,true)}</div>`:''}${showCompleted?`<div class="partition"><div class="part-head"><div class="part-title">${sameDay(date,today)?'4':'3'}. An diesem Tag erledigte Tasks</div></div>${completedDoneList(completedTasks,completedLong)}</div>`:''}</div>`;
  day.querySelector('[data-task-date]').onclick=()=>openTaskModal(iso);
  day.querySelectorAll('[data-toggle-task]').forEach(c=>{c.onclick=ev=>ev.stopPropagation();c.onchange=async(ev)=>{ev.stopPropagation();const t=state.tasks.find(x=>x.id===c.dataset.toggleTask);if(!requireLogin()){c.checked=!c.checked;return;}if(t){t.done=c.checked;t.completedDate=c.checked?fmtDate(new Date()):null;render();await dbUpdateRowRev041('tasks',t.id,{done:!!t.done,completed_date:t.completedDate||null});scheduleRelationalSave();}}});
  day.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=async(ev)=>{ev.stopPropagation();if(!requireLogin())return;const id=b.dataset.deleteTask;state.tasks=state.tasks.filter(x=>x.id!==id);render();await dbDeleteRowRev041('tasks',id);});
  day.querySelectorAll('[data-task-ref]').forEach(card=>card.onclick=()=>openTaskDetailModal(card.dataset.taskRef));
  day.querySelectorAll('[data-add-own-event]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();const [ci,iso]=b.dataset.addOwnEvent.split(':');openOwnEventModal(Number(ci),iso);});
  day.querySelectorAll('[data-event-ref]').forEach(card=>card.onclick=()=>openEventDetailModal(card.dataset.eventRef));
  return day;
};

// Langfristige Tasks: explizites DELETE statt indirektem Snapshot-Löschen.
const __rev041_renderLong=renderLong;
renderLong=function(){
  __rev041_renderLong();
  $$('[data-delete-long]').forEach(b=>b.onclick=async(ev)=>{ev.stopPropagation();if(!requireLogin())return;const id=b.dataset.deleteLong;state.longterm=state.longterm.filter(x=>x.id!==id);render();await dbDeleteRowRev041('long_tasks',id);});
  $$('[data-toggle-long]').forEach(c=>{c.onchange=async(ev)=>{ev.stopPropagation();const t=state.longterm.find(x=>x.id===c.dataset.toggleLong);if(!requireLogin()){c.checked=!c.checked;return;}if(t){t.done=c.checked;t.completedDate=c.checked?fmtDate(new Date()):null;render();await dbUpdateRowRev041('long_tasks',t.id,{done:!!t.done,completed_date:t.completedDate||null});scheduleRelationalSave();}}});
};

// Kalendergruppen und Kalenderquellen: Löschungen nur gezielt per Nutzeraktion.
const __rev041_renderCalendarConfig=renderCalendarConfig;
renderCalendarConfig=function(){
  __rev041_renderCalendarConfig();
  $$('[data-del-ics]').forEach(b=>b.onclick=async(ev)=>{ev.stopPropagation();if(!requireLogin())return;const [i,idx]=b.dataset.delIcs.split(':').map(Number);const target=state.calendars[i]?.links?.[idx];if(!target)return;
    if(target.type==='own'){
      const count=(state.calendars[i].ownEvents||[]).filter(e=>e.sourceId===target.id).length;
      if(!confirm(`Sind Sie sicher, dass Sie diesen eigenen Kalender löschen möchten?\n\nAlle darin erstellten Termine werden unwiderruflich gelöscht.\nBetroffene Termine: ${count}`))return;
    }else if(!confirm('Diese Kalenderquelle wirklich entfernen?'))return;
    state.calendars[i].links.splice(idx,1);
    state.calendars[i].events=(state.calendars[i].events||[]).filter(e=>e.icsId!==target.id);
    state.calendars[i].ownEvents=(state.calendars[i].ownEvents||[]).filter(e=>e.sourceId!==target.id);
    render();
    await dbDeleteRowRev041('calendar_sources',target.id);
  });
  $$('[data-delete-cal]').forEach(b=>b.onclick=async(ev)=>{ev.stopPropagation();if(!requireLogin())return;const i=Number(b.dataset.deleteCal);const cal=state.calendars[i];if(!cal)return;if(!confirm('Kalender inklusive aller Quellen und eigenen Terminen löschen?'))return;state.calendars.splice(i,1);render();await dbDeleteRowRev041('calendar_groups',cal.id);});
};

// Gruppenlöschung: zuerst betroffene Tasks lokal und tabellarisch auf Fallback-Gruppe verschieben, dann Gruppe gezielt löschen.
const __rev041_renderTaskColumnConfig=renderTaskColumnConfig;
renderTaskColumnConfig=function(){
  __rev041_renderTaskColumnConfig();
  $$('[data-delete-taskcol]').forEach(b=>b.onclick=async()=>{if(!requireLogin())return;const idx=Number(b.dataset.deleteTaskcol);if(state.taskColumns.length<=1)return toast('Mindestens eine Task-Spalte bleibt erhalten.');const col=state.taskColumns[idx];if(!confirm('Task-Spalte löschen? Bestehende Tasks werden in die erste verfügbare Spalte verschoben.'))return;const fallback=state.taskColumns.find((_,i)=>i!==idx)?.id||null;state.tasks.forEach(t=>{if(t.columnId===col.id)t.columnId=fallback;});state.taskColumns.splice(idx,1);render();if(fallback)await supabaseClient.from('tasks').update({task_group_id:fallback}).eq('user_id',currentUser.id).eq('task_group_id',col.id);await dbDeleteRowRev041('task_groups',col.id);scheduleRelationalSave();});
};
const __rev041_renderLongColumnConfig=renderLongColumnConfig;
renderLongColumnConfig=function(){
  __rev041_renderLongColumnConfig();
  $$('[data-delete-longcol]').forEach(b=>b.onclick=async()=>{if(!requireLogin())return;const idx=Number(b.dataset.deleteLongcol);if(state.longColumns.length<=1)return toast('Mindestens eine langfristige Gruppe bleibt erhalten.');const col=state.longColumns[idx];if(!confirm('Langfristige Gruppe löschen? Bestehende Tasks werden in die erste verfügbare Gruppe verschoben.'))return;const fallback=state.longColumns.find((_,i)=>i!==idx)?.id||null;state.longterm.forEach(t=>{if(t.columnId===col.id)t.columnId=fallback;});state.longColumns.splice(idx,1);render();if(fallback)await supabaseClient.from('long_tasks').update({long_task_group_id:fallback}).eq('user_id',currentUser.id).eq('long_task_group_id',col.id);await dbDeleteRowRev041('long_task_groups',col.id);scheduleRelationalSave();});
};
